name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref so rapid pushes don't pile up runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Config / manifest validation ─────────────────────────────────────────
  # This repo has no build system: it's markdown + JSON manifests + shell
  # install scripts. The gate lints the shell and parses every JSON file.
  # The bundled mcp/node_modules tree is excluded from both checks.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shellcheck is preinstalled on ubuntu-latest runners. Scope to error
      # severity: this gate catches real bugs (unset vars, bad quoting that
      # changes behavior) without failing on stylistic SC2086-class notes.
      - name: Shellcheck (severity=error)
        run: |
          set -euo pipefail
          shellcheck --version
          mapfile -d '' files < <(find . -name '*.sh' \
            -not -path './.git/*' -not -path '*/node_modules/*' -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no shell scripts found"; exit 0
          fi
          printf 'checking: %s\n' "${files[@]}"
          shellcheck --severity=error "${files[@]}"

      # Validate that every committed JSON manifest parses. node is preinstalled
      # on ubuntu-latest. node_modules/dist/.git are excluded (the vendored
      # node_modules tree carries thousands of third-party JSON files).
      - name: Validate JSON
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"; then
              echo "  [ok] $f"
            else
              echo "  [FAIL] invalid JSON: $f"
              fail=1
            fi
          done < <(find . -name '*.json' \
            -not -path './.git/*' -not -path '*/node_modules/*' -not -path '*/dist/*' -print0)
          exit $fail

  # ── Aggregate gate ───────────────────────────────────────────────────────
  # One stable required-status-check context. Fails if validate failed OR was
  # ── Hook tests ───────────────────────────────────────────────────────────
  # The hook scripts are the part of this plugin that runs on every tool call,
  # and nothing gated on them until #26. They shell out to the real hook
  # scripts, so they need no Gemini session and no backend.
  hook-tests:
    name: Hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Discovery, deliberately: it is the invocation the sibling plugin repos
      # use, and it reported "NO TESTS RAN" here -- exit 0 -- until these tests
      # became TestCase classes. Keeping the same invocation means a regression
      # back to bare functions shows up as 0 tests rather than a green job.
      - name: Run hook tests
        run: python -m unittest discover -s hooks/tests -p 'test_*.py' -v

  # skipped/cancelled, so the job graph can be reshaped without orphaning the
  # required check.
  # ── mcp/ build gate ─────────────────────────────────────────────────
  # Added alongside the `npm` Dependabot entry for /mcp, because that entry
  # opens a weekly stream of dependency PRs and nothing here ran npm at all --
  # validate is shellcheck + JSON, hook-tests is Python. Every one of those PRs
  # would have been green while proving nothing.
  #
  # This matters more here than in ix-cursor-plugin: mcp/dist is NOT committed
  # in this repo, so install.sh:106 runs `npm ci && npm run build` on the user's
  # machine at install time. A bump that breaks `tsc` breaks every install, and
  # without this job there is no signal anywhere before that.
  mcp:
    name: mcp build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install
        run: npm ci
        working-directory: mcp

      # `npm ci` does NOT catch a lock whose root requires packages the manifest
      # no longer does -- measured on ix-cursor-plugin, where exactly that drift
      # left 5 Dependabot alerts open that no PR could close, and `npm ci` still
      # exited 0. Regenerating and diffing is what sees it.
      - name: Lockfile is in sync with package.json
        run: |
          npm install --package-lock-only --no-audit --no-fund
          git diff --exit-code -- package-lock.json
        working-directory: mcp

      - name: Typecheck
        run: npm run typecheck
        working-directory: mcp

      # The same command install.sh:106 runs on the user's machine.
      - name: Build
        run: npm run build
        working-directory: mcp

  ci-success:
    name: CI Passed
    if: always()
    needs: [validate, hook-tests, mcp]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          echo "validate=${{ needs.validate.result }}"
          echo "hook-tests=${{ needs.hook-tests.result }}"
          echo "mcp=${{ needs.mcp.result }}"
          [ "${{ needs.validate.result }}" = "success" ]
          [ "${{ needs.hook-tests.result }}" = "success" ]
          [ "${{ needs.mcp.result }}" = "success" ]
